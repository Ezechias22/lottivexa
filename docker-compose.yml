services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lottivexa
      POSTGRES_USER: lottivexa
      POSTGRES_PASSWORD: lottivexa_dev
    ports: ["5432:5432"]
    volumes: [lottivexa_pg:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U lottivexa"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [lottivexa_redis:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
  printing-worker:
    profiles: ["printing"]
    build: {context: ., dockerfile: infrastructure/docker/Dockerfile.printing-worker}
    restart: unless-stopped
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    security_opt: [no-new-privileges:true]
volumes: {lottivexa_pg: {}, lottivexa_redis: {}}
