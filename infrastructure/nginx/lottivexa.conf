limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;
upstream api { server api:4000; keepalive 32; }
upstream tenant_web { server tenant-web:3000; keepalive 32; }
upstream master_admin { server master-admin:3000; keepalive 16; }
upstream merchant_web { server merchant-web:3000; keepalive 32; }
upstream public_site { server public-site:3000; keepalive 16; }
include /etc/nginx/custom-domains/*.conf;

server {
  listen 80 default_server;
  server_name ${PLATFORM_DOMAIN} www.${PLATFORM_DOMAIN} api.${PLATFORM_DOMAIN} admin.${PLATFORM_DOMAIN} app.${PLATFORM_DOMAIN} pos.${PLATFORM_DOMAIN} *.${PLATFORM_DOMAIN};
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 308 https://$host$request_uri; }
}
