name: Keep LOTTIVEXA API warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm-api:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check production health
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 15 --max-time 70 \
            https://lottivexa-api.onrender.com/api/v1/health
