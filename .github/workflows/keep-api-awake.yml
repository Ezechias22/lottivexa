name: Keep Lottivexa API Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-api:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          curl --fail --silent --show-error \
            https://lottivexa-api.onrender.com/api/v1/health
