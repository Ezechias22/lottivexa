name: lottivexa_mobile
description: Lottivexa secure offline-capable POS client
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter: {sdk: flutter}
  flutter_localizations: {sdk: flutter}
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  go_router: ^15.1.2
  drift: ^2.26.1
  sqlite3_flutter_libs: ^0.5.32
  sqlite3: ^2.7.5
  cryptography: ^2.7.0
  connectivity_plus: ^6.1.4
  path_provider: ^2.1.5
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.26.1
flutter:
  uses-material-design: true
  assets:
    - assets/branding/lottivexa-logo.png
